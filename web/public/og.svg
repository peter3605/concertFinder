<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ConcertFinder — concerts near you, chosen by what you already listen to">
  <!-- Source for og.png. The PNG is what the meta tags point at, because most
       social scrapers do not render SVG.

       Regenerating it on macOS without ImageMagick: qlmanage pads a
       non-square SVG into a square thumbnail and top-aligns it, so rendering
       this file directly yields 1200x1200 with white below the design. Wrap
       it in a 1200x1200 square, offset by the difference, render, then take
       the centred crop back out:

         { echo '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200">'
           echo '<rect width="1200" height="1200" fill="#0e0f11"/><g transform="translate(0 285)">'
           sed -e 1d -e '$d' og.svg; echo '</g></svg>'; } > /tmp/sq.svg
         qlmanage -t -s 1200 -o /tmp /tmp/sq.svg
         sips -c 630 1200 /tmp/sq.svg.png --out og.png -->
  <rect width="1200" height="630" fill="#0e0f11"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1abc53"/>
  <g transform="translate(96 148) scale(3.2)">
    <rect width="32" height="32" rx="7" fill="#1abc53"/>
    <g fill="#ffffff">
      <path d="M13.2 8.4 24 5.6v3.4L13.2 11.8z"/>
      <rect x="13.2" y="8.4" width="1.9" height="13.2"/>
      <rect x="22.1" y="5.6" width="1.9" height="11.6"/>
      <ellipse cx="10.9" cy="21.8" rx="3.6" ry="2.9"/>
      <ellipse cx="19.8" cy="19.4" rx="3.6" ry="2.9"/>
    </g>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="96" y="352" font-size="86" font-weight="700" letter-spacing="-2">ConcertFinder</text>
    <text x="96" y="424" font-size="38" font-weight="400" fill="#b6bbc2">Concerts near you, by the artists you</text>
    <text x="96" y="474" font-size="38" font-weight="400" fill="#b6bbc2">already listen to.</text>
    <text x="96" y="556" font-size="26" font-weight="500" fill="#1abc53">concertfinder.app</text>
  </g>
</svg>
