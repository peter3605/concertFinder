# XcodeGen spec. The .xcodeproj is generated from this and is NOT checked in —
# merge conflicts in a .pbxproj are miserable, and this repo already prefers
# config as text (plan §5.1).
#
# Regenerate after adding files:  cd ios && xcodegen generate

name: ConcertFinder

options:
  bundleIdPrefix: com.concertfinder
  deploymentTarget:
    # iOS 17 gets @Observable, ContentUnavailableView, and the current
    # navigation APIs with no back-compat shims. Plan §5.1.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Strict concurrency is the point of targeting Swift 6 here: the app is a
    # network client with a shared cache and a poll timer, which is exactly
    # the shape that grows data races quietly.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  ConcertFinder:
    type: application
    platform: iOS
    sources:
      - path: ConcertFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.concertfinder.app
        INFOPLIST_FILE: ConcertFinder/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ConcertFinder/Resources/ConcertFinder.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad — reviewers do open the iPad build
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # The API origin is a build setting, not a constant, so a debug build
        # points at the local server and a release build at the deployment
        # without a code change. Info.plist reads it as $(CF_API_BASE_URL).
        Debug:
          CF_API_BASE_URL: https://127.0.0.1:3000
        Release:
          CF_API_BASE_URL: https://concertfinder.app

  ConcertFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConcertFinderTests
    dependencies:
      - target: ConcertFinder
    settings:
      base:
        # Fixtures are captured real responses, not hand-written literals
        # (plan §8), so they ship as resources rather than string constants.
        GENERATE_INFOPLIST_FILE: YES

  ConcertFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConcertFinderUITests
    dependencies:
      - target: ConcertFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ConcertFinder:
    build:
      targets:
        ConcertFinder: all
    run:
      config: Debug
      # Points at the local server by default. Release builds override this
      # with the deployed origin.
      environmentVariables:
        CF_API_BASE_URL: https://127.0.0.1:3000
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ConcertFinderTests
        - ConcertFinderUITests
