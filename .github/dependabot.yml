# Dependency updates. Four ecosystems, because the deployed artifact is built
# from four: the Go binary, the SPA bundled into it, the image both run in, and
# the workflow that ships them.
#
# Grouped and weekly rather than per-dependency and daily. Every merge to main
# deploys (deploy.yml), so an ungrouped Dependabot is an ungrouped stream of
# production deploys — each one a container rebuild on a 2 GB instance and a
# window where the site is cycling. One PR per ecosystem per week is a deploy
# you can watch.
#
# ios/ is absent on purpose: the app has no package manager (no SPM
# dependencies in ios/project.yml), and it ships through Xcode, not this repo's
# pipeline.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ['*']

  # web/, not /: package.json lives there, and Dependabot resolves the manifest
  # relative to this path — pointed at the root it finds nothing and reports no
  # error, which is the silent-no-op shape this repo keeps running into.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns: ['*']

  # All three stages are pinned by digest (`node:24-alpine@sha256:...`), which
  # is reproducible and therefore frozen: nothing re-resolves those tags. This
  # is the only thing that moves them, so without it the Go toolchain and the
  # distroless base never receive a security update at all.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # Actions are pinned by major tag (actions/checkout@v7), so this only fires on
  # a major bump — rare, and exactly the one you want to read before merging,
  # since a broken action fails the deploy rather than the build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
