name: iOS

# Deliberately separate from deploy.yml rather than a job inside it. The
# backend deploy must not wait on — or be blocked by — a Swift build: the two
# ship through different channels on different cadences, and a macOS runner is
# both slower and scarcer than ubuntu-latest. Plan §5.2.
#
# Path-filtered for the same reason deploy.yml ignores ios/: a Go-only commit
# has nothing here to check.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

# Group is per-workflow rather than shared with deploy.yml: the two ship on
# different cadences and must not cancel one another. Unconditional
# cancel-in-progress is fine here because this workflow only ever builds and
# tests — it publishes nothing, so an interrupted run leaves nothing half-done.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every plist, privacy manifest and entitlements file under ios/, parsed as
  # strict XML. App Store processing rejected build 1.0.0 (2) with ITMS-91056
  # because PrivacyInfo.xcprivacy had a double hyphen inside a comment, which
  # XML forbids, and NOTHING here noticed: plutil -lint, xcodebuild and the
  # build job below all accept it, because Apple's own parser is lenient and
  # the manifest is copied into the bundle verbatim (CF-43). Python's expat is
  # not lenient, which is the point. On ubuntu because it needs no Xcode and a
  # macOS runner bills at roughly ten times the rate.
  plist-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every plist as strict XML
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find ios -type f \( -name '*.plist' \
            -o -name '*.xcprivacy' -o -name '*.entitlements' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::found no plist files under ios/; the find is wrong"
            exit 1
          fi
          python3 -B scripts/release/lib/release_kit.py strict-xml "${files[@]}"

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The .xcodeproj is generated, not committed — project.yml is the
      # source of truth (plan §5.1). Generating it here also proves the spec
      # is valid, which a committed .pbxproj would not.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Build and test in one action so a compile error and a test failure
      # are told apart by the step that fails, not by reading the log.
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          # Pick a simulator that actually exists on this runner rather than
          # naming one. Device line-ups change between Xcode releases — on
          # Xcode 26 there is no plain "iPhone 17" at all, only the Pro, Pro
          # Max and 17e — so a hardcoded name is a build that breaks on an
          # image update for no real reason. Takes the first available iPhone;
          # simctl lists newest runtimes last, so this is stable enough.
          udid=$(xcrun simctl list devices available \
            | awk -F'[()]' '/^ +iPhone/ {print $2; exit}')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"

          # xcbeautify ships on the GitHub macOS images, but piping through a
          # tool that might not exist would swallow the build behind a
          # "command not found". Fall back to raw output instead.
          if command -v xcbeautify >/dev/null 2>&1; then
            fmt=(xcbeautify)
          else
            fmt=(cat)
          fi
          xcodebuild test \
            -project ConcertFinder.xcodeproj \
            -scheme ConcertFinder \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO \
            | "${fmt[@]}"
