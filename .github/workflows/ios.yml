name: iOS

# Deliberately separate from deploy.yml rather than a job inside it. The
# backend deploy must not wait on — or be blocked by — a Swift build: the two
# ship through different channels on different cadences, and a macOS runner is
# both slower and scarcer than ubuntu-latest. Plan §5.2.
#
# Path-filtered for the same reason deploy.yml ignores ios/: a Go-only commit
# has nothing here to check.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The .xcodeproj is generated, not committed — project.yml is the
      # source of truth (plan §5.1). Generating it here also proves the spec
      # is valid, which a committed .pbxproj would not.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Build and test in one action so a compile error and a test failure
      # are told apart by the step that fails, not by reading the log.
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          # Pick a simulator that actually exists on this runner image rather
          # than naming one. Device line-ups change between Xcode releases —
          # "iPhone 17" is not a device at all on Xcode 26, only the Pro,
          # Pro Max and 17e are — so a hardcoded name is a build that breaks
          # on an image update for no real reason.
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "
import json, sys
devices = json.load(sys.stdin)['devices']
for runtime in sorted(devices, reverse=True):
    if 'iOS' not in runtime:
        continue
    for d in devices[runtime]:
        if d.get('isAvailable') and d['name'].startswith('iPhone'):
            print(d['udid'])
            raise SystemExit
raise SystemExit('no available iPhone simulator')
")
          echo "Using simulator $udid"

          # xcbeautify ships on the GitHub macOS images, but piping through a
          # tool that might not exist would swallow the build behind a
          # "command not found". Fall back to raw output instead.
          if command -v xcbeautify >/dev/null 2>&1; then
            fmt=(xcbeautify)
          else
            fmt=(cat)
          fi
          xcodebuild test \
            -project ConcertFinder.xcodeproj \
            -scheme ConcertFinder \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO \
            | "${fmt[@]}"
