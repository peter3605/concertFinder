name: Deploy

# `pull_request` runs the two checking jobs on the PR itself. Without it they
# only ran on push to main — i.e. after merge, as part of the deploy — so a red
# `test` was a fix-forward on main rather than a PR that simply won't merge.
# The `deploy` job is guarded below so this stays a check, not a deploy.
# `ios/**` is excluded from both triggers. The app ships through Xcode and
# App Store Connect, not through this workflow, so a Swift-only commit has
# nothing to deploy — without the filter it would still rebuild the image on
# the 2 GB EC2 box and cycle the containers for a change the server cannot
# see. ios.yml is what checks that directory.
on:
  push:
    branches: [main]
    paths-ignore: ['ios/**']
  pull_request:
    branches: [main]
    paths-ignore: ['ios/**']
  workflow_dispatch:

# Least privilege by default. `id-token: write` is granted to the deploy job
# alone rather than workflow-wide, so the AWS-federation token can't be minted
# from a pull_request run of the checking jobs.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Go formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Go vet
        run: go vet ./...
      # `go test` compiles packages that have tests; it does not prove the
      # server binary builds. Several packages here have no test files.
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend install
        run: npm --prefix web ci
      - name: Frontend typecheck
        run: npm --prefix web run lint
      # The deploy step below builds the image ON the EC2 instance, so a
      # frontend build failure used to surface there — mid-deploy, on a 2 GB
      # box, with the previous containers already being replaced. Failing here
      # instead costs 30 seconds and keeps the site up.
      - name: Frontend build
        run: npm --prefix web run build

  # docker-compose.prod.yml and the Caddyfile are the only files here that
  # never run locally — docker-compose.yml has no Caddy service and `go run`
  # reads neither. Both have shipped broken, and the symptom each time was a
  # Caddy crash loop with a healthy-looking api container beside it. Parsing
  # them in CI costs seconds; finding out in production costs the site.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Caddyfile and compose files
        run: ./scripts/check-deploy-config.sh

  deploy:
    needs: [test, deploy-config]
    # Never from a pull_request run — those exist to check the branch, not to
    # ship it. Phrased as != 'pull_request' rather than == 'push' so
    # workflow_dispatch still deploys.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC federation to AWS; scoped to this job only
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # NOTE: the image is built on the EC2 instance. `build` is a separate
      # step from `up -d` on purpose — `up -d --build` tears down the running
      # containers as part of the same command, so a build that fails or runs
      # the 2 GB box out of memory took the site down with it. Split, a failed
      # build leaves the current containers serving and fails the SSM command
      # loudly instead.
      #
      # `up -d --wait` blocks on the api container's healthcheck instead of
      # returning the moment the container is started. Without it a container
      # that exits immediately — which config.Validate does deliberately on a
      # bad .env — still produced a zero exit, an SSM "Success" and a green
      # workflow while `restart: unless-stopped` crash-looped it and the site
      # stayed down. verify-deploy.sh then probes the whole chain through
      # Caddy, which is the half `--wait` cannot see: the healthcheck runs
      # inside the api container and proves only that the Go process answers
      # itself, while every deploy defect this repo has shipped was a Caddy
      # crash loop beside a healthy api container.
      #
      # A `--wait` failure is swallowed on purpose so verify-deploy.sh still
      # runs: it is the authoritative verdict and it dumps `ps` + container
      # logs on the way out, which is the output you actually need. It fails
      # the SSM command by itself if the site is really down.
      #
      # Building in this workflow and pushing to ECR would remove the risk
      # entirely (and free the instance from carrying a Node toolchain); it
      # needs an ECR repository plus pull permissions on the instance profile,
      # which is a change in /infra rather than here.
      - name: Deploy via SSM
        id: ssm
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy from GitHub Actions run ${{ github.run_id }}" \
            --parameters commands='[
              "set -euo pipefail",
              "cd /opt/concertfinder",
              "sudo -u concertfinder git fetch --all",
              "sudo -u concertfinder git reset --hard origin/main",
              "sudo ./scripts/render-env.sh",
              "sudo -u concertfinder docker compose -f docker-compose.prod.yml pull || true",
              "sudo -u concertfinder docker compose -f docker-compose.prod.yml build",
              "sudo -u concertfinder docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 240 || echo compose-wait-failed-verify-deploy-below-is-the-verdict",
              "sudo -u concertfinder ./scripts/verify-deploy.sh",
              "sudo -u concertfinder docker image prune -f"
            ]' \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Started SSM command $COMMAND_ID"

      - name: Wait for deploy to finish
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Print deploy output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query '{status:Status, stdout:StandardOutputContent, stderr:StandardErrorContent}' \
            --output json
