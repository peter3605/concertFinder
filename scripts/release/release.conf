# release.conf - what the release kit needs to know about this app.
# Field reference: release.conf.example beside this file.

APP_NAME="ConcertFinder"
PROJECT_DIR="ios"
PROJECT="ConcertFinder.xcodeproj"
SCHEME="ConcertFinder"
# The .xcodeproj is generated, not committed (ios/project.yml).
GENERATE_CMD="xcodegen generate"
VERSION_FILE="project.yml"

INFO_PLIST="ConcertFinder/Resources/Info.plist"
PRIVACY_MANIFEST="ConcertFinder/Resources/PrivacyInfo.xcprivacy"

BUNDLES=(
  ".|ConcertFinder/Resources/ConcertFinder.entitlements"
)

REQUIRED_ENTITLEMENTS=(
  # Push. An App Store export carries "production" whatever the source says.
  ".|aps-environment=production"
  # Universal links: the OAuth and email sign-in callbacks.
  ".|com.apple.developer.associated-domains=applinks:concertfinder.app"
  # ASWebAuthenticationSession's https callback validates through this; without
  # it sign-in hangs on the provider's page with no error.
  ".|com.apple.developer.associated-domains=webcredentials:concertfinder.app"
)

LOG_SOURCE_DIRS=(
  "ios/ConcertFinder"
)
LOG_PRIVACY_ALLOWED=(
)

STORE_COPY="docs/store-copy.md"
# 1.0: no What's New field yet. privacy_policy_url and review_notes are
# pasted into App Privacy and App Review Information, not the listing.
STORE_COPY_FIELDS=(name subtitle keywords promotional_text description privacy_policy_url review_notes)
